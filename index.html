<h1>SyncAg</h1>
<p>SyncAg — внутренняя интеграция 1С с облачным хранилищем владельца.</p>
<h2>Политика конфиденциальности</h2>
<p>Приложение использует доступ к облачному хранилищу только для загрузки и чтения файлов,
созданных из 1С. Данные не передаются третьим лицам и не используются в других целях.</p>
